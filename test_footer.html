<!DOCTYPE html>
<html>
<head>
  <style>
    :root { --ivory: #FBFAF6; --ink: #1A1612; }
    html { background-color: var(--ivory) !important; scroll-behavior: auto; overscroll-behavior-y: none; }
    body { background: var(--ivory); color: var(--ink); margin: 0; overflow-x: clip !important; min-height: 100vh; }
    #sk-site-wrap { position: relative; z-index: 2; background: var(--ivory); margin-bottom: 200px; height: 150vh; }
    .footer { background: var(--ink); color: #fff; position: fixed; bottom: 0; left: 0; right: 0; z-index: 0; height: 200px; visibility: visible; }
  </style>
</head>
<body>
  <div id="sk-site-wrap">
    <h1>Scroll down to see footer</h1>
  </div>
  <footer class="footer" id="sk-footer">
    <h1>This is the footer</h1>
  </footer>
</body>
</html>
